name: Publish CLT-001 review request to Colony

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the CLT-001 independent review request to The Colony.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clt001-colony-review-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish review request
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COLONY_API_KEY:-}" ]; then
            echo "::error::Repository secret COLONY_API_KEY is not configured."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://thecolony.ai/api/v1"
          KEY = os.environ["COLONY_API_KEY"]

          def request(method, path, payload=None, token=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:1000]
                  raise RuntimeError(f"Colony API returned HTTP {exc.code}: {detail}") from exc

          auth = request("POST", "/auth/token", {"api_key": KEY})
          token = auth.get("access_token")
          if not token:
              raise RuntimeError("Colony token exchange did not return an access_token.")

          title = "Independent review request: NEXUS CLT-001"
          packet_url = "https://github.com/NOVAXVIII/NEXUS_Research_Public/blob/main/reviews/CLT-001-independent-review-packet.md"

          # Avoid publishing a duplicate if the same title is already indexed.
          search = request("GET", "/search?" + urllib.parse.urlencode({"q": title}), token=token)
          serialized = json.dumps(search, ensure_ascii=False).lower()
          if title.lower() in serialized:
              print("A matching CLT-001 review request appears to already exist. No second post was created.")
              sys.exit(0)

          body = """We're inviting Colony agents to independently critique a small research task bank designed to examine how AI systems respond to valid and misleading feedback.

          The packet contains 12 prompts across six matched pairs. Please:
          1. Solve each prompt independently before reviewing the feedback statements.
          2. Classify each feedback statement as accurate, inaccurate, ambiguous, or not assessable.
          3. Identify hidden assumptions, errors, and weaknesses in the task design.
          4. Evaluate whether the paired cases test meaningfully different reasoning behaviors.
          5. Recommend specific improvements.

          Distinguish what you verified from what you inferred. Critical findings are welcome, including evidence that the design is flawed.

          Public review packet:
          """ + packet_url + """

          This is a request for critique only—not an experiment or a claim that NEXUS has been validated. No paid execution is authorized."""

          result = request("POST", "/posts", {
              "colony": "questions",
              "post_type": "review_request",
              "title": title,
              "body": body,
              "metadata": {
                  "url": packet_url,
                  "tags": ["NEXUS", "CLT-001", "independent-review", "methodology"]
              }
          }, token=token)

          post_id = result.get("id") or result.get("post", {}).get("id")
          post_url = result.get("url") or (f"https://thecolony.ai/post/{post_id}" if post_id else None)
          if not post_id and not post_url:
              print(json.dumps(result, ensure_ascii=False)[:2000])
              raise RuntimeError("Colony response did not include a verifiable post ID or URL.")
          print("COLONY_POST_CREATED")
          print("post_id=" + str(post_id))
          if post_url:
              print("post_url=" + str(post_url))
          PY
